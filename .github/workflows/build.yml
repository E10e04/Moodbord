# ============================================================
# Moodboard — Build & Release
#
# Construit tous les livrables sur les machines GitHub :
#   • Extension CEP (zip)
#   • Application Windows : Setup.exe (NSIS) + zip portable
#   • Application macOS : .dmg Intel x64 + Apple Silicon arm64
#
# Déclencheurs :
#   • à la demande  : onglet Actions ▸ Build & Release ▸ Run workflow
#   • Release public : pousser un tag « v* » → Release créé automatiquement
#     avec tous les installateurs en pièces jointes
#
# Aucun Mac ni Windows requis sur votre machine.
# ============================================================
name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# Un seul run à la fois par référence (tag/branche) : deux runs
# concurrents qui publient sur le même Release se suppriment mutuellement
# des assets (race condition sur overwrite_files) — le plus récent
# annule le précédent.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Extension CEP ────────────────────────────────────────────
  cep:
    name: Extension CEP (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Valider puis packager l'extension
        working-directory: moodboard-cep
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          node scripts/validate.mjs
          node scripts/package.mjs

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: moodboard-cep-zip
          path: moodboard-cep/dist/moodboard-cep-*.zip
          if-no-files-found: error

  # ── Application Windows (Setup.exe + portable) ────────────────
  desktop-windows:
    name: Application Windows (Setup.exe + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: moodboard-desktop/package-lock.json

      - name: Installer les dépendances
        working-directory: moodboard-desktop
        run: npm ci

      - name: Préparer l'icône .exe (rcedit natif Windows)
        working-directory: moodboard-desktop
        shell: bash
        run: |
          cp build/icon-multi.ico build/icon.ico
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build.win.signAndEditExecutable=true;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Construire (installateur NSIS + zip portable)
        working-directory: moodboard-desktop
        run: npx electron-builder --win nsis zip --publish never

      - name: Renommer le zip portable
        working-directory: moodboard-desktop
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          f=$(ls dist/*.zip | head -1)
          mv "$f" "dist/Moodboard-${v}-Windows-x64-portable.zip"

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: moodboard-windows
          path: |
            moodboard-desktop/dist/*.exe
            moodboard-desktop/dist/*.zip
          if-no-files-found: error

  # ── Application macOS (dmg Intel + Apple Silicon) ─────────────
  desktop-macos:
    name: Application macOS (dmg x64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: moodboard-desktop/package-lock.json

      - name: Installer les dépendances
        working-directory: moodboard-desktop
        run: npm ci

      - name: Synchroniser le renderer (client + CSP)
        working-directory: moodboard-desktop
        run: node scripts/sync-client.mjs

      - name: Construire les .dmg (x64 + arm64)
        working-directory: moodboard-desktop
        env:
          # Pas de certificat de signature : désactive la découverte
          # automatique d'identité pour éviter l'échec du build.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # NB : les cibles passées en CLI écrasent la liste d'architectures
        # du package.json — les drapeaux --x64 --arm64 sont OBLIGATOIRES
        # pour obtenir les deux .dmg (Intel + Apple Silicon), sinon seul
        # l'arch du runner est construit (arm64 sur macos-latest).
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: moodboard-macos
          path: moodboard-desktop/dist/*.dmg
          if-no-files-found: error

  # ── Release publique (uniquement sur tag v*) ─────────────────
  release:
    name: Publication du Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cep, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Vérifier la présence des 5 installateurs attendus
        run: |
          ls -la artifacts/
          test -f artifacts/moodboard-cep-*.zip
          test -f artifacts/Moodboard-Setup-*.exe
          test -f artifacts/Moodboard-*-Windows-x64-portable.zip
          test -f artifacts/Moodboard-*-x64.dmg   # macOS Intel
          test -f artifacts/Moodboard-*-arm64.dmg # macOS Apple Silicon
          echo "OK : les 5 installateurs sont présents avant publication."

      - name: Nettoyer les assets obsolètes du Release
        # v1.13.0 : un re-tag (desktop versionnée après coup, asset renommé)
        # laissait les ANCIENS fichiers à côté des nouveaux — on repart
        # d'un Release vierge avant l'upload (overwrite_files ne retire
        # que les doublons de MÊME nom).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rid=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.id' 2>/dev/null || true)
          if [ -n "${rid}" ] && [ "${rid}" != "null" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${rid}/assets" --jq '.[].id' | while read -r aid; do
              echo "Suppression de l'asset obsolète #${aid}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" || true
            done
          fi

      - name: Créer le Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier le contenu publié du Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 8
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[].name' | sort > published.txt
          (cd artifacts && ls | sort) > expected.txt
          echo '--- attendu ---'; cat expected.txt
          echo '--- publié ---'; cat published.txt
          MISSING=$(comm -23 expected.txt published.txt)
          if [ -n "${MISSING}" ]; then
            echo "ERREUR : fichiers manquants dans le Release : ${MISSING}"
            exit 1
          fi
          echo "OK : les $(wc -l < expected.txt) fichiers sont publiés."
